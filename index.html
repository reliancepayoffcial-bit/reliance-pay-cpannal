    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      (function() {
        // Intercept console.error for harmless Vite dev server HMR websocket notifications in cloud sandbox
        const _origConsoleError = console.error;
        console.error = function(...args) {
          const match = args.some(function(arg) {
            if (!arg) return false;
            const str = (arg.message || arg.stack || String(arg));
            return str.includes('WebSocket closed without opened') || (str.includes('[vite]') && str.includes('WebSocket'));
          });
          if (match) return;
          _origConsoleError.apply(console, args);
        };

        // Intercept window errors & unhandled rejections
        window.addEventListener('error', function(e) {
          const msg = (e && (e.message || (e.error && e.error.message))) || '';
          const file = (e && e.filename) || '';
          if (msg.includes('WebSocket') || file.includes('@vite/client') || msg.includes('[vite]')) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          const reason = (e && e.reason && (e.reason.message || e.reason.stack || String(e.reason))) || '';
          if (reason.includes('WebSocket') || reason.includes('@vite/client') || reason.includes('[vite]')) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-[#0A0F1D] text-white selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
