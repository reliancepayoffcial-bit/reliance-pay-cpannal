    <meta property="og:title" content="Reliance Pay - Official Fintech & High-Yield Investment Platform" />
    <meta property="og:description" content="Reliance Pay Official Web App: Secure Asset Wallet, Automated 12-Hour Dividend Distribution, Fast UPI Recharges, and Instant Bank Withdrawals." />

    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      (function() {
        // 1. Permanently prevent Vite HMR WebSocket connection drops in iframe cloud sandbox
        try {
          const _OrigWebSocket = window.WebSocket;
          if (_OrigWebSocket) {
            window.WebSocket = function(url, protocols) {
              const isViteHmr = (protocols === 'vite-hmr') ||
                (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
                (typeof url === 'string' && (url.includes('vite') || url.includes('/@vite')));

              if (isViteHmr) {
                const target = new EventTarget();
                target.url = url;
                target.readyState = 1; // OPEN
                target.CONNECTING = 0;
                target.OPEN = 1;
                target.CLOSING = 2;
                target.CLOSED = 3;
                target.binaryType = 'blob';
                target.bufferedAmount = 0;
                target.extensions = '';
                target.protocol = 'vite-hmr';
                target.send = function() {};
                target.close = function() { target.readyState = 3; };
                return target;
              }
              return new _OrigWebSocket(url, protocols);
            };
            window.WebSocket.prototype = _OrigWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        } catch (_) {}

        // 2. Intercept console.error for harmless dev server notifications
        const _origConsoleError = console.error;
        console.error = function(...args) {
          const match = args.some(function(arg) {
            if (!arg) return false;
            const str = (arg.message || arg.stack || String(arg));
            return str.includes('WebSocket') || str.includes('[vite]');
          });
          if (match) return;
          _origConsoleError.apply(console, args);
        };

        // 3. Intercept window errors & unhandled rejections
        window.addEventListener('error', function(e) {
          const msg = (e && (e.message || (e.error && e.error.message))) || '';
          const file = (e && e.filename) || '';
          if (msg.includes('WebSocket') || file.includes('@vite/client') || msg.includes('[vite]')) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          const reason = (e && e.reason && (e.reason.message || e.reason.stack || String(e.reason))) || '';
          if (reason.includes('WebSocket') || reason.includes('@vite/client') || reason.includes('[vite]')) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-[#0A0F1D] text-white selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
